name: Pnpm

description: Set up pnpm and install dependencies (including yarn fixture installs)

inputs:
  node-version:
    description: "Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0."
    default: "22"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs['node-version'] }}
        # pnpm is installed in the next step; opt out of setup-node v6's
        # auto-detection of the packageManager field so it does not try to
        # call `pnpm` before that.
        package-manager-cache: false

    - name: Install pnpm and corepack
      shell: bash
      run: |
        if [[ "${{runner.os}}" == "Windows" ]]; then
          # add the npm prefix to PATH to ensure the installed corepack work properly
          NPM_PREFIX=$(cygpath -u "$(npm config get prefix)")
          export PATH="$NPM_PREFIX:$PATH"
        fi
        npm install -g corepack@0.31.0 --force
        echo "Corepack version: $(corepack --version)"
        corepack enable
        pnpm --version

    - name: yarn
      shell: bash
      run: |
        cd fixtures/pnp
        yarn install
        cd ../pnp-global-cache-enabled
        yarn install

    - name: pnpm
      shell: bash
      run: |
        pnpm install
