name: Release Full

on:
  workflow_dispatch:
    inputs:
      commit:
        required: true
        type: string
        description: "Full Commit SHA to release"
      tag:
        type: choice
        description: "Release Npm Tag"
        required: false
        default: "latest"
        options:
          - canary
          - nightly
          - latest
          - beta
          - alpha
      test:
        type: boolean
        description: "Run tests before release"
        required: false
        default: false
      dry_run:
        type: boolean
        description: "DryRun release"
        required: false
        default: false
      push_tags:
        type: boolean
        description: "push tags to github"
        required: false
        default: true

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false # Build and test everything so we can look at all the errors
      matrix:
        array:
          - target: x86_64-unknown-linux-gnu
            runner: "ubuntu-22.04"
          - target: aarch64-unknown-linux-gnu
            runner: "ubuntu-22.04"
          - target: x86_64-unknown-linux-musl
            runner: "ubuntu-22.04"
          - target: aarch64-unknown-linux-musl
            runner: "ubuntu-22.04"
          - target: i686-pc-windows-msvc
            runner: "windows-latest"
          - target: x86_64-pc-windows-msvc
            runner: "windows-latest"
          - target: aarch64-pc-windows-msvc
            runner: "windows-latest"
          - target: x86_64-apple-darwin
            runner: "macos-latest"
          - target: aarch64-apple-darwin
            runner: "macos-latest"

    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build.yml
    with:
      target: ${{ matrix.array.target }}
      runner: ${{ matrix.array.runner }}
      test: false
      profile: "release"
      ref: ${{ inputs.commit }}

  release:
    name: Release
    environment: npm
    permissions:
      # push release tag via scripts/x.mjs publish --push-tags
      contents: write
      # OIDC provenance for npm publish
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    #    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This makes Actions fetch only one branch to release
          fetch-depth: 1
          ref: ${{ inputs.commit }}

      - name: Pnpm Setup
        uses: ./.github/actions/pnpm

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: ls
        run: ls -R artifacts

      - name: Move artifacts
        run: |
          pnpm napi version   --package-json-path npm/package.json --npm-dir bindings
          pnpm napi artifacts --package-json-path npm/package.json --npm-dir bindings --build-output-dir napi

      - name: Show binding packages
        run: ls -R bindings

      - name: Update npm
        run: npm install -g npm@latest

      - name: Release Full
        run: |
          git status
          cp napi/{index,browser}.js  npm
          cp napi/index.d.ts          npm
          pnpm node scripts/x.mjs prepublish
          pnpm --config.verify-deps-before-run=false node scripts/x.mjs    publish --tag ${{inputs.tag}} ${{inputs.dry_run && '--dry-run' || '--no-dry-run'}} ${{inputs.push_tags && '--push-tags' || '--no-push-tags'}}
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          ONLY_RELEASE_TAG: true
